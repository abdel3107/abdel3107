<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" fill="none" role="img" aria-label="Pouotouo Abdel Zidane — Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8F4EE"/>
      <stop offset="0.52" stop-color="#F7F8FD"/>
      <stop offset="1" stop-color="#ECEBFB"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B4FE0"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1C46"/>
      <stop offset="1" stop-color="#3A2FB0"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#3A2FB0" stroke-width="1" opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#4338CA" flood-opacity="0.22"/>
    </filter>
    <clipPath id="round"><rect width="1280" height="340" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#round)" font-family="'Poppins','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <circle cx="130" cy="40" r="130" fill="#B9E9D0" opacity="0.55" filter="url(#soft)"/>
    <circle cx="1190" cy="320" r="160" fill="#C9C4F7" opacity="0.6" filter="url(#soft)"/>
    <rect width="1280" height="340" fill="url(#grid)"/>

    <!-- Left: identity -->
    <text x="74" y="108" font-size="15" font-weight="700" letter-spacing="3.2" fill="#4338CA">SOFTWARE ENGINEER · DOUALA, CAMEROON</text>
    <text x="72" y="172" font-size="52" font-weight="800" letter-spacing="-0.5" fill="url(#ink)">Pouotouo Abdel Zidane</text>
    <text x="74" y="212" font-size="21" font-weight="600" fill="#565B72">Backend Systems &#160;•&#160; Flutter Apps &#160;•&#160; Machine Learning</text>
    <text x="74" y="242" font-size="15" font-weight="500" fill="#6B7088">Building reliable software with clean architecture — for real-world impact.</text>

    <!-- Availability chip -->
    <g transform="translate(72,262)">
      <rect width="262" height="40" rx="20" fill="#E4F3EA"/>
      <circle cx="24" cy="20" r="5.5" fill="#22A06B">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="42" y="25" font-size="14" font-weight="700" fill="#1B7F53">Open to opportunities &amp; collaboration</text>
    </g>

    <!-- Right: Zekora-style dashboard motif -->
    <g transform="translate(918,0)">
      <!-- indigo metric card -->
      <rect x="0" y="82" width="292" height="150" rx="20" fill="url(#indigo)" filter="url(#shadow)"/>
      <rect x="22" y="104" width="150" height="12" rx="6" fill="#FFFFFF" opacity="0.28"/>
      <text x="22" y="168" font-size="40" font-weight="800" fill="#FFFFFF">&lt;/&gt;</text>
      <rect x="22" y="186" width="96" height="16" rx="8" fill="#FFFFFF" opacity="0.24"/>
      <rect x="130" y="186" width="60" height="16" rx="8" fill="#FFFFFF" opacity="0.18"/>

      <!-- mint success chip floating on the card -->
      <g transform="translate(196,58)" filter="url(#shadow)">
        <rect width="116" height="42" rx="21" fill="#FFFFFF"/>
        <path d="M20 26 L27 17 L34 26" fill="none" stroke="#22A06B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="46" y="27" font-size="15" font-weight="800" fill="#1B7F53">12%</text>
      </g>

      <!-- bar chart echoing the Zekora dashboard -->
      <g>
        <rect x="8"   y="272" width="28" height="34" rx="6" fill="#4338CA" opacity="0.78"/>
        <rect x="48"  y="256" width="28" height="50" rx="6" fill="#4338CA" opacity="0.82"/>
        <rect x="88"  y="264" width="28" height="42" rx="6" fill="#4338CA" opacity="0.8"/>
        <rect x="128" y="240" width="28" height="66" rx="6" fill="#4B40D6"/>
        <rect x="168" y="250" width="28" height="56" rx="6" fill="#4B40D6"/>
        <rect x="208" y="228" width="28" height="78" rx="6" fill="#5B4FE0"/>
      </g>
    </g>

    <rect x="1" y="1" width="1278" height="338" rx="25" fill="none" stroke="#4338CA" stroke-opacity="0.12" stroke-width="1.5"/>
  </g>
</svg>
